name: Build

on:
  push:
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: fabric
            name: Fabric
          - loader: neoforge
            name: NeoForge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.name }} with Gradle
        run: ./gradlew :${{ matrix.loader }}:build --console=plain

      - name: Upload ${{ matrix.name }} JARs
        uses: actions/upload-artifact@v4
        with:
          name: craftable-${{ matrix.loader }}
          path: ${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error
