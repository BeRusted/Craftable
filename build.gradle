plugins {
    id 'base'
}

// Platform plugins and Minecraft dependencies belong to the subprojects.
allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version
}

subprojects {
    repositories {
        mavenCentral()
    }

    plugins.withId('java') {
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(21)
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }
    }
}

// Explicit task paths keep root lifecycle tasks useful for both loaders.
tasks.named('assemble') {
    dependsOn(':neoforge:assemble', ':fabric:assemble')
}

tasks.named('check') {
    dependsOn(':neoforge:check', ':fabric:check')
}

tasks.named('build') {
    dependsOn(':neoforge:build', ':fabric:build')
}

tasks.named('wrapper', Wrapper) {
    distributionType = Wrapper.DistributionType.BIN
}
